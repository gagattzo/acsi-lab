# Manual check of what the maintainers' FINRA API Public credential can read. Prints dataset fields and a few rows
# to the run log; commits nothing. Needs repository secrets FINRA_CLIENT_ID and FINRA_CLIENT_SECRET.
name: finra-probe
on:
  workflow_dispatch:
    inputs:
      issuer:
        description: Issuer name to sample
        default: COREWEAVE
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python research/tools/finra_probe.py "${{ inputs.issuer }}"
        env:
          FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
          FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
