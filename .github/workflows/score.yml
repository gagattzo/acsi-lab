# Scores every method file a pull request adds or changes, against the baseline, and posts the scorecard.
# Security: this runs with the base branch's harness only. From the pull request it reads methods/*.yaml as
# data (parsed with yaml.safe_load); it never checks out or runs code from the pull request.
name: score
on:
  pull_request_target:
    paths: ['methods/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Copy the proposed method files (data only)
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "pull/${PR}/head:pr"
          mkdir -p proposed
          git diff --name-only --diff-filter=AM -z "$BASE" pr -- 'methods/*.yaml' | while IFS= read -r -d '' f; do
            name=$(basename "$f" | tr -cd 'A-Za-z0-9._-')
            git show "pr:$f" > "proposed/$name"
          done
          ls proposed
      - uses: actions/cache@v4
        with:
          path: data/dtcc_cache
          key: dtcc-${{ github.run_id }}
          restore-keys: dtcc-
      - run: python harness/dtcc.py --days 400
      - name: Score
        run: |
          : > scorecard.md
          for f in proposed/*.yaml; do
            [ -e "$f" ] || continue
            if python harness/score.py "$f" --baseline methods/v0.1-live.yaml --md "$f.md"; then cat "$f.md" >> scorecard.md
            else echo "Could not score \`$(basename "$f")\`: check that every source is one the harness knows (see sources.yaml)." >> scorecard.md; fi
            echo >> scorecard.md
          done
          [ -s scorecard.md ] || echo "No method files changed." > scorecard.md
      - uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('scorecard.md', 'utf8') + '\n\n_Scored by the base-branch harness on free daily data. Baseline: `methods/v0.1-live.yaml`._';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.pull_request.number, body });
            await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.pull_request.number, labels: ['proposal', 'scored'] });
