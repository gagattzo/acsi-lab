# Deterministic regressions on every change. Live-source integration is an explicit
# dispatch, so a market-source outage is not confused with a code regression.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_source_integration:
        description: 'Fetch DTCC history and run source/schema integration checks'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-bonds.txt
      - name: Offline regressions (data-dependent checks report skipped)
        run: python -m pytest -q tests
      - name: Report validation scope
        run: |
          echo '### Offline code validation' >> "$GITHUB_STEP_SUMMARY"
          echo 'No new source data collected. Passing unit tests does not establish full-history validation or settlement readiness.' >> "$GITHUB_STEP_SUMMARY"
  source-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_source_integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-bonds.txt
      - uses: actions/cache@v4
        with:
          path: data/raw/dtcc
          key: dtcc-raw-${{ github.run_id }}
          restore-keys: dtcc-raw-
      - name: Build the canonical tables from DTCC
        run: python harness/dtcc.py --days 400
      - name: Validate source completeness and canonical hashes
        run: |
          python - <<'PY'
          from harness.refresh_scoreboard import source_gate, ROOT
          _, reasons = source_gate(ROOT)
          if reasons:
              raise SystemExit('Source integration blocked: ' + ', '.join(reasons))
          PY
      - run: python harness/validate.py schema/cds_trades.yaml schema/cds_daily.yaml
      - name: All tests on the built data
        run: python -m pytest -q tests
