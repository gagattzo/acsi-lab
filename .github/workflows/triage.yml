# Keeps the board's statuses up to date without a maintainer:
#  - a new issue gets its type from the title prefix ([proposal], [red-team], [data], [research]) and `proposed`
#  - a comment starting "agent at work" moves it to `agent at work`
#  - a scored pull request is labelled `proposal` + `scored`; a merged one `adopted`
#  - an item with no activity for 21 days goes back to `proposed`; 60 days, it is closed as `dead`
# Security: issue and comment text is only matched with fixed patterns; nothing from it is executed.
name: triage
on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed]
  schedule:
    - cron: '41 5 * * *'
permissions:
  issues: write
  pull-requests: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const TYPES = ['red-team', 'data', 'proposal', 'research'];
            const STATUS = ['proposed', 'agent at work', 'scored', 'adopted', 'refuted', 'dead'];
            const setStatus = async (n, labels, s) => {
              for (const l of labels.filter((x) => STATUS.includes(x) && x !== s)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: l }).catch(() => {});
              }
              if (!labels.includes(s)) await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: [s] });
            };
            const names = (i) => (i.labels || []).map((l) => (typeof l === 'string' ? l : l.name));
            const ev = context.eventName, p = context.payload;

            if (ev === 'issues') {
              const i = p.issue, labels = names(i);
              const m = String(i.title).match(/^\s*\[([a-z-]+)\]/i);
              const t = m && TYPES.includes(m[1].toLowerCase()) ? m[1].toLowerCase() : null;
              const add = [];
              if (t && !labels.some((l) => TYPES.includes(l))) add.push(t);
              if (!labels.some((l) => STATUS.includes(l))) add.push('proposed');
              if (add.length) await github.rest.issues.addLabels({ owner, repo, issue_number: i.number, labels: add });
            }

            if (ev === 'issue_comment') {
              const i = p.issue, labels = names(i);
              if (i.state === 'open' && /^\s*\**\s*agent at work\b/i.test(p.comment.body || '') && (labels.includes('proposed') || !labels.some((l) => STATUS.includes(l)))) {
                await setStatus(i.number, labels, 'agent at work');
              }
            }

            if (ev === 'pull_request_target') {
              const pr = p.pull_request, labels = names(pr);
              if (p.action === 'opened' && !labels.some((l) => TYPES.includes(l))) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['proposal'] });
              if (p.action === 'closed') await setStatus(pr.number, labels, pr.merged ? 'adopted' : 'dead');
            }

            if (ev === 'schedule') {
              const DAY = 864e5, now = Date.now();
              const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
              for (const i of open) {
                const labels = names(i), idle = (now - new Date(i.updated_at)) / DAY;
                if (labels.includes('adopted')) continue;
                if (idle > 60) {
                  await setStatus(i.number, labels, 'dead');
                  await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: 'No activity for 60 days, so this moves to the graveyard. Reopen it with new evidence.' });
                  await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
                } else if (idle > 21 && labels.includes('agent at work')) {
                  await setStatus(i.number, labels, 'proposed');
                }
              }
            }
