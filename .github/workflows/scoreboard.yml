# Re-scores every method in methods/ each weekday evening on fresh DTCC data and commits scoreboard/scoreboard.json,
# which aistress.si/lab shows as the leaderboard.
name: scoreboard
on:
  schedule:
    - cron: '17 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scoreboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/raw/dtcc
          key: dtcc-raw-${{ github.run_id }}
          restore-keys: dtcc-raw-
      - name: Refresh scoreboard only from complete, hash-bound inputs
        run: python harness/refresh_scoreboard.py --collect --days 400
      - run: |
          git config user.name 'acsi-lab bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scoreboard/scoreboard.json scoreboard/last_attempt.json manifests/dtcc_sha256.csv
          git diff --cached --quiet || (git commit -m 'Scoreboard: record source-checked research refresh status' && git push)
