name: daily-trace-update

on:
  schedule:
    # Mon-Fri at 22:30 UTC (after US fixed-income markets close)
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow playwright
          python -m playwright install --with-deps chromium

      - name: Scrape FINRA TRACE tape (Append-Only)
        run: python harness/finra_trace.py

      - name: Compute daily G-Spreads and par curve interpolation
        run: python harness/bond_spreads.py

      - name: Safety Guard Verification
        run: |
          python - <<'PY'
          import json, sys
          with open('data/acsi_bond_universe_latest.json') as f:
              bonds = json.load(f)
          active = sum(1 for b in bonds if b.get('status') in ('active', 'carried'))
          print(f"Safety Check: {active}/24 active AI infrastructure bonds.")
          if active < 15:
              print(f"CRITICAL ALERT: Only {active}/24 bonds active (< 15 threshold). FINRA portal may be blocking or tape empty.", file=sys.stderr)
              sys.exit(1)
          print("Safety check passed.")
          PY

      - name: Commit and push updated data artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/acsi_bond_spreads_daily.json data/acsi_bond_universe_latest.json data/bond_reference.json data/trace_trades_raw.parquet data/trace_trades_clean.parquet
          git diff --cached --quiet || (git commit -m 'chore: daily TRACE 24-bond G-spread update [skip ci]' && git push origin main)
