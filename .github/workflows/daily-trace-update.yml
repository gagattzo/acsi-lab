name: bond-research-validation
# Collection is paused: no cron, raw-source uploads or publication from this job.
# Restore scheduling only after private execution and retention pass an end-to-end run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-trace-update.yml'
      - 'harness/**'
      - 'tests/**'
      - 'requirements-bonds.txt'
      - 'index.html'
      - 'headline.js'
      - 'api/**'
  pull_request:
    paths:
      - '.github/workflows/daily-trace-update.yml'
      - 'harness/**'
      - 'tests/**'
      - 'requirements-bonds.txt'
      - 'index.html'
      - 'headline.js'
      - 'api/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements-bonds.txt
      - name: Validate bond pipeline regressions
        run: python -m pytest -q tests/test_bond_research.py tests/test_daily_runner.py tests/test_finra_snapshots.py tests/test_source_archive.py
      - name: Validate homepage when present
        run: |
          if [ -f tests/headline.test.js ]; then
            node --test tests/headline.test.js
          fi
      - name: Report collection state
        run: |
          echo '### Bond collection is paused' >> "$GITHUB_STEP_SUMMARY"
          echo 'Code validation only. No sources collected and no market observations published. Scheduling remains disabled until private execution and retention are verified.' >> "$GITHUB_STEP_SUMMARY"
