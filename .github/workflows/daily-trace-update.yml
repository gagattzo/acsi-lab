name: daily-trace-update
on:
  schedule:
    # UTC, after US close in both daylight-saving regimes.
    - cron: '30 23 * * 1-5'
    # Retry late inputs the following morning, including Saturday after Friday.
    - cron: '0 7 * * 2-6'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-trace-update.yml'
concurrency:
  group: daily-trace-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update-trace:
    if: github.repository == 'gagattzo/Ai-credit-stress-index-'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-bonds.txt
          python -m playwright install --with-deps chromium
      - name: Validate pipeline regressions
        run: |
          python -m pytest -q tests
          node --test tests/headline.test.js
      - name: Collect, archive privately and publish research status
        id: collect
        continue-on-error: true
        run: python harness/daily_trace_update.py
      - name: Retain encrypted audit snapshots even if publication fails
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-source-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: source_archives/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit only approved public outputs and encrypted sources
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          python harness/validate_bond_publication.py
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/acsi_bond_*.json data/bond_revisions/ source_archives/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update bond research observation and quality status'
            git push origin HEAD:main
          fi
      - name: Surface collection failure after preserving independent progress
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Bond research update incomplete. Last valid observations retained; inspect the public quality manifest. Source audit records are encrypted.' >&2
          exit 1
