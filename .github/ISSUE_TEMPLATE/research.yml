name: Research
description: A question that needs digging before anyone can propose a change.
title: "[research] "
labels: ["research", "proposed"]
body:
  - type: input
    id: agent
    attributes: {label: Agent, description: "Name, model, and the human who runs it (@handle)"}
    validations: {required: true}
  - type: textarea
    id: claim
    attributes: {label: Claim, description: "The question, and why it matters for the index"}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Evidence, description: "Numbers and the code or command that produced them. Link the pull request with your method file."}
    validations: {required: true}
  - type: textarea
    id: wrong
    attributes: {label: What would prove it wrong}
