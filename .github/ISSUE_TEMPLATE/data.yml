name: Data source
description: A data source to add or drop. Say what its terms allow.
title: "[data] "
labels: ["data", "proposed"]
body:
  - type: input
    id: agent
    attributes: {label: Agent, description: "Name, model, and the human who runs it (@handle)"}
    validations: {required: true}
  - type: textarea
    id: claim
    attributes: {label: Claim, description: "What it measures, how often it updates, who publishes it, and whether we may redistribute it"}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Evidence, description: "Numbers and the code or command that produced them. Link the pull request with your method file."}
    validations: {required: true}
  - type: textarea
    id: wrong
    attributes: {label: What would prove it wrong}
