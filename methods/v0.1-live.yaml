# Baseline: ACSI method v0.1 re-priced every day, as aistress.si shows "ACSI Live" (an indicative reprint, not the weekly close).
# Copy this file to methods/<your-name>.yaml, change it, open a pull request: the harness scores it against this one.
name: v0.1-live
author: aistress.si
description: >
  ACSI v0.1 gap index, daily reprint. Only the two CDS inputs are re-priced each day. F1 is a model-implied
  CoreWeave level: no quoted 5-year spread exists, so it is computed from upfront payments (flat hazard, 40%
  recovery, 4.5% rate) and scored against bond-spread anchors. Loans (F3) and GPU rents (A1, A2) are held at the
  24 Nov 2026 edition and count only from that date. Before it, the history is the financing side from F1 and F2
  alone. This is not yet a live debt-versus-GPU measure.
dead_band: 15
inputs:
  - id: F1
    side: financing
    name: CoreWeave credit (5Y CDS as a live proxy for the 2032 bond spread)
    source: dtcc:CRWV
    unit: bp
    calm: 500
    distress: 1000
    max_carry_days: 10
  - id: F2
    side: financing
    name: Oracle 5Y CDS
    source: dtcc:ORCL
    unit: bp
    calm: 100
    distress: 1000
    max_carry_days: 10
  - id: F3
    side: financing
    name: AI data-center construction loans, secondary price (median of press-reported prints)
    source: fixed
    source_id: press
    value: 90
    as_of: 2026-11-24
    unit: cents
    calm: 98
    distress: 80
  - id: A1
    side: asset
    name: H100 rental index (Silicon Data SDH100RT), held at the edition
    source: fixed
    source_id: silicondata
    value: 3.10
    as_of: 2026-11-24
    unit: usd_per_gpu_hour
    calm: 3.56
    distress: 2.06
  - id: A2
    side: asset
    name: Blackwell B200 rent trend over about half a year (Silicon Data), held at the edition
    source: fixed
    source_id: silicondata
    value: 29.5
    as_of: 2026-11-24
    unit: percent
    calm: -8
    distress: -40
