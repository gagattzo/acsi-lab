table: cds_trades
file: data/canonical/cds_trades.csv
grain: one priced on-the-run 5-year single-name CDS trade
built_by: harness/dtcc.py
key: [date, entity, dissemination_id]
columns:
  - {name: date, type: date, description: "Trade date: the end-of-day file it was published in (UTC)"}
  - {name: entity, type: enum, values: [ORCL, CRWV, META], description: Reference entity}
  - {name: dissemination_id, type: string, description: "DTCC Dissemination Identifier of the kept record (after corrections)"}
  - {name: exec_ts, type: datetime, description: Execution time as reported}
  - {name: kind, type: enum, values: [quoted, upfront], description: "quoted: spread reported directly; upfront: converted from the upfront payment"}
  - {name: spread_bp, type: float, min: 10, max: 10000, unit: bp, description: Par spread used for the daily median}
  - {name: coupon, type: float, nullable: true, min: 0, max: 100, unit: decimal, description: "Running coupon as reported (0.01 = 1%). Values above 0.2 are percent units: issue #7"}
  - {name: upfront_pct, type: float, nullable: true, unit: percent of notional, description: "Upfront payment, unsigned, as % of notional"}
  - {name: notional_capped, type: bool, description: "Notional shows the reporting cap (+); true size is larger"}
